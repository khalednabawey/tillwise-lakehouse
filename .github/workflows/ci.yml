name: ci

# Every push and pull request: lint, then all unit tests (PySpark on a local session, the agent on a
# tiny DuckDB gold layer with a fake model). No API keys or Databricks workspace needed.
# The 30-question agent eval needs the full gold export and model keys, so it runs locally:
#   uv run python scripts/export_gold_local.py && uv run python evals/run_eval.py

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --all-groups --extra agent

      - name: Lint
        run: uv run ruff check .

      - name: Unit tests
        run: uv run pytest
