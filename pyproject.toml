[project]
name = "tillwise"
version = "0.1.0"
description = "Tillwise: a retail sales lakehouse on Databricks. Medallion Delta tables with data-quality rules, SCD Type 2 products, demand forecasting in MLflow, and a data agent on the gold layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyspark>=4.0,<4.1",
]

[project.optional-dependencies]
# The data agent: FastAPI + LangGraph over the gold layer (DuckDB locally, Databricks SQL in the cloud).
agent = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "langchain-core>=1.0",
    "langchain-groq>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]
databricks = ["databricks-sql-connector>=4.0"]

[dependency-groups]
dev = [
    "chispa>=0.11",
    "httpx>=0.27",
    "holidays>=0.60",
    "mlflow-skinny>=2.17",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pytest>=8.3",
    "requests>=2.32",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tillwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks get spark, dbutils, display, CATALOG and T from Databricks and `%run ./_bootstrap`.
"databricks/**" = ["F821", "E402"]
