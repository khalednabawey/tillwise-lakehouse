[project]
name = "tillwise"
version = "0.1.0"
description = "Tillwise: a retail sales lakehouse on Databricks. Medallion Delta tables with data-quality rules, SCD Type 2 products, demand forecasting in MLflow, and a data agent on the gold layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyspark>=4.0,<4.1",
]

[dependency-groups]
dev = [
    "chispa>=0.11",
    "holidays>=0.60",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pytest>=8.3",
    "requests>=2.32",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tillwise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks get spark, dbutils, display, CATALOG and T from Databricks and `%run ./_bootstrap`.
"databricks/*" = ["F821", "E402"]
