  <rect x="1142" y="478" width="428" height="290" rx="14" fill="#ecfdf5" stroke="#34d399" stroke-width="2"/>
  <text x="1160" y="502" class="h" fill="#047857">SERVING</text>

  <rect x="1158" y="514" width="396" height="168" rx="10" class="card"/>
  <text x="1172" y="538" class="t">Data agent ("ask the lakehouse")</text>
  <text x="1172" y="557" class="xs">FastAPI POST /ask → LangGraph</text>
  <rect x="1172" y="566" width="110" height="28" rx="6" fill="#d1fae5"/>
  <text x="1227" y="585" font-size="12" fill="#065f46" text-anchor="middle">LLM picks tool</text>
  <rect x="1300" y="566" width="122" height="28" rx="6" fill="#d1fae5"/>
  <text x="1361" y="585" font-size="12" fill="#065f46" text-anchor="middle">9 read-only tools</text>
  <rect x="1440" y="566" width="100" height="28" rx="6" fill="#d1fae5"/>
  <text x="1490" y="585" font-size="12" fill="#065f46" text-anchor="middle">grounding</text>
  <line x1="1282" y1="580" x2="1296" y2="580" stroke="#065f46" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="1422" y1="580" x2="1436" y2="580" stroke="#065f46" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1172" y="616" class="xs">Groq (gpt-oss-120b) → OpenRouter fallback on any error</text>
  <text x="1172" y="634" class="xs">tools query gold via Databricks SQL warehouse (or DuckDB locally)</text>
  <text x="1172" y="652" class="xs">every number must come from a tool result, or one retry</text>
  <text x="1172" y="672" class="num">Eval: 30/30 questions (answers checked against SQL)</text>

  <rect x="1158" y="692" width="396" height="60" rx="10" class="card"/>
  <text x="1172" y="716" class="t">AI/BI dashboard</text>
  <text x="1172" y="736" class="s">revenue trend · top products · returns · segments · forecast</text>

  <path class="flow" d="M1104,586 C1126,586 1132,600 1154,600"/>
  <path class="flow" d="M1356,448 L1356,511"/>
  <path class="dash" d="M1104,300 C1130,300 1130,722 1154,722"/>

  <!-- ============ ENGINEERING ============ -->
  <rect x="30" y="796" width="1540" height="232" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="50" y="824" class="h" fill="#0f172a">ENGINEERING · one codebase, four places it runs</text>

  <rect x="50" y="842" width="300" height="164" rx="10" fill="#f1f5f9"/>
  <text x="66" y="868" class="t">GitHub repo</text>
  <text x="66" y="888" class="s">khalednabawey/tillwise-lakehouse</text>
  <text x="66" y="910" class="s">src/tillwise/ (pure PySpark functions)</text>
  <text x="66" y="928" class="s">databricks/ notebooks + pipeline</text>
  <text x="66" y="946" class="s">evals/ · tests/ · resources/ (bundle)</text>
  <text x="66" y="974" class="xs">Databricks pulls it as a Git folder</text>

  <rect x="380" y="842" width="300" height="164" rx="10" fill="#f1f5f9"/>
  <text x="396" y="868" class="t">GitHub Actions CI</text>
  <text x="396" y="888" class="s">every push: ruff + 31 unit tests</text>
  <text x="396" y="910" class="s">PySpark on a local session (chispa)</text>
  <text x="396" y="928" class="s">agent on a tiny DuckDB gold layer</text>
  <text x="396" y="946" class="s">with a fake LLM (no keys needed)</text>
  <text x="396" y="974" class="num">status: passing</text>

  <rect x="710" y="842" width="400" height="164" rx="10" fill="#f1f5f9"/>
  <text x="726" y="868" class="t">The same functions run in</text>
  <text x="726" y="892" class="s">① unit tests (local Spark)</text>
  <text x="726" y="912" class="s">② local runners: run_local · run_forecast_local · export_gold</text>
  <text x="726" y="932" class="s">③ Databricks notebooks 00–07</text>
  <text x="726" y="952" class="s">④ the Lakeflow pipeline</text>
  <text x="726" y="978" class="xs">notebooks hold no business logic of their own</text>

  <rect x="1140" y="842" width="410" height="164" rx="10" fill="#f1f5f9"/>
  <text x="1156" y="868" class="t">Local development path</text>
  <text x="1156" y="890" class="s">download_sources → data/raw/*.csv</text>
  <text x="1156" y="910" class="s">export_gold_local → data/gold/*.parquet</text>
  <text x="1156" y="930" class="s">uvicorn tillwise.agent.app:app → /docs</text>
  <text x="1156" y="950" class="s">evals/run_eval.py → evals/reports/latest.md</text>
  <text x="1156" y="978" class="xs">Python 3.12 · uv · PySpark 4 · Java 17+</text>

