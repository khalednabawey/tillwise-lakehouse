<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowW" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .s  { font-size: 12.5px; fill: #334155; }
      .xs { font-size: 11.5px; fill: #475569; }
      .h  { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .num{ font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; filter: url(#shadow); }
      .flow { stroke: #475569; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #64748b; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="1060" fill="#f8fafc"/>

  <!-- title -->
  <text x="30" y="46" font-size="28" font-weight="800" fill="#0f172a">Tillwise · how it works</text>
  <text x="32" y="72" font-size="14.5" fill="#475569">Retail sales lakehouse on Databricks Free Edition: from raw invoices to a forecast and a data agent. Numbers are from the Databricks run on 21 Nov 2026.</text>

  <!-- ============ ORCHESTRATION BAR ============ -->
  <rect x="30" y="92" width="1540" height="58" rx="10" fill="#0f172a"/>
  <text x="50" y="117" font-size="12.5" font-weight="700" fill="#94a3b8" letter-spacing="1.5">ORCHESTRATION</text>
  <text x="50" y="138" font-size="14" font-weight="700" fill="#ffffff">Databricks Job  tillwise-daily</text>
  <text x="262" y="138" font-size="12" fill="#cbd5e1">created by notebook 07 (Databricks SDK) · same settings as the Asset Bundle in resources/</text>
  <rect x="820" y="104" width="190" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="915" y="126" font-size="13" fill="#e0f2fe" text-anchor="middle">1 · refresh_pipeline</text>
  <rect x="1050" y="104" width="200" height="34" rx="17" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1150" y="126" font-size="13" fill="#ede9fe" text-anchor="middle">2 · backtest_forecast</text>
  <rect x="1290" y="104" width="250" height="34" rx="17" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1415" y="126" font-size="13" fill="#ede9fe" text-anchor="middle">3 · forecast_next_weeks</text>
  <line x1="1012" y1="121" x2="1046" y2="121" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowW)"/>
  <line x1="1252" y1="121" x2="1286" y2="121" stroke="#ffffff" stroke-width="2" marker-end="url(#arrowW)"/>

  <!-- ============ SOURCES ============ -->
  <text x="30" y="188" class="h" fill="#0369a1">SOURCES</text>
  <rect x="30" y="200" width="200" height="92" rx="10" class="card"/>
  <rect x="30" y="200" width="6" height="92" rx="3" fill="#0284c7"/>
  <text x="46" y="224" class="t">UCI Online Retail II</text>
  <text x="46" y="244" class="s">UK gift retailer, Dec 2009 –</text>
  <text x="46" y="261" class="s">Dec 2011 · CC BY 4.0</text>
  <text x="46" y="280" class="num">1,067,371 invoice lines</text>

  <rect x="30" y="306" width="200" height="62" rx="10" class="card"/>
  <rect x="30" y="306" width="6" height="62" rx="3" fill="#0284c7"/>
  <text x="46" y="331" class="t">UK bank holidays</text>
  <text x="46" y="351" class="s">holidays package (2009–2012)</text>

  <rect x="30" y="382" width="200" height="62" rx="10" class="card"/>
  <rect x="30" y="382" width="6" height="62" rx="3" fill="#0284c7"/>
  <text x="46" y="407" class="t">Open-Meteo</text>
  <text x="46" y="427" class="s">London daily weather (optional)</text>

  <!-- landing volume -->
  <rect x="258" y="270" width="168" height="120" rx="10" class="card"/>
  <rect x="258" y="270" width="168" height="30" rx="10" fill="#e0f2fe"/>
  <rect x="258" y="290" width="168" height="10" fill="#e0f2fe"/>
  <text x="342" y="291" font-size="13" font-weight="700" fill="#0369a1" text-anchor="middle">UNITY CATALOG VOLUME</text>
  <text x="342" y="322" class="t" text-anchor="middle">landing</text>
  <text x="342" y="342" class="xs" text-anchor="middle">/Volumes/tillwise/raw/</text>
  <text x="342" y="358" class="xs" text-anchor="middle">landing/retail · reference</text>
  <text x="342" y="378" class="xs" text-anchor="middle" font-style="italic">loaded by 00b_load_sources</text>

  <path class="flow" d="M230,246 C245,246 245,300 256,305"/>
  <path class="flow" d="M230,337 L256,337"/>
  <path class="flow" d="M230,413 C245,413 245,370 256,365"/>

  <!-- ============ LAKEFLOW PIPELINE ============ -->
  <rect x="448" y="172" width="670" height="596" rx="14" fill="#eef2ff" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="466" y="196" class="h" fill="#0369a1">LAKEFLOW DECLARATIVE PIPELINE · tillwise-medallion</text>
  <text x="466" y="215" class="xs">serverless · 13 tables · same tested functions as the local runner · no actions inside table functions</text>

  <!-- bronze -->
  <text x="470" y="248" class="h" fill="#b45309">BRONZE</text>
  <rect x="466" y="258" width="180" height="168" rx="10" class="card"/>
  <rect x="466" y="258" width="180" height="8" rx="4" fill="#c2762e"/>
  <text x="480" y="290" class="t">transactions_raw</text>
  <text x="480" y="312" class="s">Auto Loader (cloudFiles)</text>
  <text x="480" y="330" class="s">incremental, checkpointed</text>
  <text x="480" y="348" class="s">all columns as strings</text>
  <text x="480" y="366" class="s">+ source file, ingest time</text>
  <text x="480" y="398" class="num">1,067,371 rows</text>

  <!-- silver -->
  <text x="676" y="248" class="h" fill="#475569">SILVER</text>
  <rect x="672" y="258" width="210" height="64" rx="10" class="card"/>
  <rect x="672" y="258" width="210" height="8" rx="4" fill="#94a3b8"/>
  <text x="686" y="288" class="t">transactions</text>
  <text x="686" y="308" class="s">clean sales + returns · <tspan class="num">1,021,332</tspan></text>

  <rect x="672" y="332" width="210" height="64" rx="10" class="card"/>
  <rect x="672" y="332" width="210" height="8" rx="4" fill="#ef4444"/>
  <text x="686" y="362" class="t">transactions_quarantine</text>
  <text x="686" y="382" class="s">one dq_reason per row · <tspan class="num">6,039</tspan></text>

  <rect x="672" y="406" width="210" height="64" rx="10" class="card"/>
  <rect x="672" y="406" width="210" height="8" rx="4" fill="#94a3b8"/>
  <text x="686" y="436" class="t">non_product_lines</text>
  <text x="686" y="456" class="s">postage, fees · <tspan class="num">5,665</tspan></text>

  <rect x="672" y="480" width="210" height="64" rx="10" class="card"/>
  <rect x="672" y="480" width="210" height="8" rx="4" fill="#94a3b8"/>
  <text x="686" y="510" class="t">products_scd2</text>
  <text x="686" y="530" class="s">SCD Type 2 · <tspan class="num">6,695</tspan> versions</text>

  <rect x="672" y="554" width="210" height="64" rx="10" class="card"/>
  <rect x="672" y="554" width="210" height="8" rx="4" fill="#94a3b8"/>
  <text x="686" y="584" class="t">dq_metrics</text>
  <text x="686" y="604" class="s">row counts per outcome</text>

  <!-- expectations badge -->
  <rect x="466" y="446" width="180" height="172" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="480" y="472" font-size="13" font-weight="700" fill="#b91c1c">Data-quality rules</text>
  <text x="480" y="494" class="xs">6 named expectations</text>
  <text x="480" y="512" class="xs">(pass/fail count per rule)</text>
  <text x="480" y="536" class="xs">de-duplication:</text>
  <text x="480" y="553" class="num">34,335 removed</text>
  <text x="480" y="576" class="xs">incl. 22,523 rows of a week</text>
  <text x="480" y="593" class="xs">in both source sheets</text>
  <text x="480" y="610" class="xs">nothing dropped silently</text>

  <!-- gold -->
  <text x="912" y="248" class="h" fill="#b45309">GOLD</text>
  <rect x="908" y="258" width="196" height="64" rx="10" class="card"/>
  <rect x="908" y="258" width="196" height="8" rx="4" fill="#f59e0b"/>
  <text x="922" y="288" class="t">fact_sales</text>
  <text x="922" y="308" class="s">product version at sale time</text>

  <rect x="908" y="332" width="196" height="64" rx="10" class="card"/>
  <rect x="908" y="332" width="196" height="8" rx="4" fill="#f59e0b"/>
  <text x="922" y="362" class="t">dimensions</text>
  <text x="922" y="382" class="xs">product · customer · country · date</text>

  <rect x="908" y="406" width="196" height="64" rx="10" class="card"/>
  <rect x="908" y="406" width="196" height="8" rx="4" fill="#f59e0b"/>
  <text x="922" y="436" class="t">customer_rfm</text>
  <text x="922" y="456" class="s">6 segments · Champions <tspan class="num">1,335</tspan></text>

  <rect x="908" y="480" width="196" height="64" rx="10" class="card"/>
  <rect x="908" y="480" width="196" height="8" rx="4" fill="#f59e0b"/>
  <text x="922" y="510" class="t">weekly_product_demand</text>
  <text x="922" y="530" class="s">227 series × 104 full weeks</text>

  <rect x="908" y="554" width="196" height="64" rx="10" class="card"/>
  <rect x="908" y="554" width="196" height="8" rx="4" fill="#f59e0b"/>
  <text x="922" y="584" class="t">v_sales (agent view)</text>
  <text x="922" y="604" class="s">read-only, from notebook 06</text>

  <!-- pipeline arrows -->
  <path class="flow" d="M426,330 L462,330"/>
