  <path class="flow" d="M882,512 C894,512 894,364 904,364"/>
  <path class="flow" d="M882,300 C894,320 894,430 904,436"/>

  <!-- pipeline footer -->
  <text x="466" y="648" class="xs">Lessons from the first Databricks runs, now in the code:</text>
  <text x="466" y="668" class="xs">• no count/first/collect inside table functions (tables don't exist yet when the graph is planned)</text>
  <text x="466" y="686" class="xs">• TIMESTAMP_NTZ columns need delta.feature.timestampNtz on every table</text>
  <text x="466" y="704" class="xs">• serverless can't cache → try_cache() · Spark ML models save through a UC volume</text>
  <text x="466" y="740" class="num">Run time on Free Edition: pipeline 8.5 min · backtest 2.5 min · forecast 2 min</text>

  <!-- ============ FORECASTING ============ -->
  <rect x="1142" y="172" width="428" height="290" rx="14" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2"/>
  <text x="1160" y="196" class="h" fill="#6d28d9">FORECASTING · notebooks 04 + 05</text>

  <rect x="1158" y="210" width="396" height="92" rx="10" class="card"/>
  <text x="1172" y="234" class="t">04 · Backtest (last 12 weeks, one origin)</text>
  <text x="1172" y="254" class="s">Spark ML gradient-boosted trees, one model for 1–12 weeks ahead</text>
  <text x="1172" y="273" class="s">vs seasonal naive · 4-week average · last value → logged to MLflow</text>
  <text x="1172" y="292" class="num">WAPE 0.646 (4-wk avg 0.677) · bias −3% vs −41%</text>

  <rect x="1158" y="312" width="396" height="66" rx="10" class="card"/>
  <text x="1172" y="336" class="t">05 · Final model on all history</text>
  <text x="1172" y="356" class="s">registered in Unity Catalog: <tspan class="num">ml.demand_gbt@champion</tspan></text>
  <text x="1172" y="372" class="xs">bands = p10/p90 of backtest errors (relative, so they scale)</text>

  <rect x="1158" y="388" width="396" height="60" rx="10" class="card"/>
  <rect x="1158" y="388" width="396" height="8" rx="4" fill="#f59e0b"/>
  <text x="1172" y="416" class="t">gold.forecast_weekly</text>
  <text x="1172" y="436" class="s">next 8 weeks per series, with p10 / p90 · <tspan class="num">1,816 rows</tspan></text>

  <path class="flow" d="M1530,302 L1530,309"/>
  <path class="flow" d="M1530,378 L1530,385"/>
  <path class="flow" d="M1104,512 C1126,512 1130,256 1154,256"/>

